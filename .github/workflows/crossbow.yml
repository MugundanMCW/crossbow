# NOTE: must set "Crossbow" as name to have the badge links working in the
# github comment reports!
name: Crossbow
on:
  push:
    branches:
      - "*-github-*"

env:
  ARCHERY_DEBUG: 1

jobs:
  build:
    name: "Build wheel for Windows ARM64"
    runs-on: "windows-11-arm"
    timeout-minutes: 240
    env:
      PYTHON_CMD: "py -3.12"
      CMAKE_BUILD_TYPE: release
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: arrow
          repository: MugundanMCW/arrow
          ref: 552cdecae365bfdb042043209280786fa01ea03f
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "ARM64"  

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: "vcpkg-installed-windows-arm64-${{ hashFiles('arrow/ci/vcpkg/vcpkg.json', 'arrow/ci/vcpkg/arm64-windows-*.cmake') }}"      
          restore-keys: vcpkg-installed-windows-arm64-
      
      - name: Install vcpkg dependencies
        shell: cmd
        run: |
          cd arrow\ci\vcpkg
          C:\vcpkg\vcpkg.exe install ^
            --binarysource="clear;x-gha,readwrite" ^
            --x-install-root=C:\vcpkg\installed ^
            --x-manifest-root=. ^
            --x-feature=flight ^
            --x-feature=json ^
            --x-feature=orc ^
            --x-feature=parquet ^
            --x-feature=s3
      - name: Build Arrow C++ and PyArrow wheel
        shell: cmd
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "18.0.0"
        run: |
          call "arrow\ci\scripts\python_wheel_windows_arm64_build.bat"
      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: arrow/python/repaired_wheels/*.whl
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Checkout Crossbow
        uses: actions/checkout@v4
        with:
          path: crossbow
          ref: build-29
      - name: Setup Crossbow
        shell: bash
        run: |
          python3 -m pip install -e arrow/dev/archery[crossbow]
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Upload artifacts
        shell: bash
        run: |
          archery crossbow \
            --queue-path $(pwd)/crossbow \
            --queue-remote https://github.com/MugundanMCW/crossbow.git \
            upload-artifacts \
            --sha build-29-github-wheel-windows-cp312-cp312-arm64 \
            --tag build-29-github-wheel-windows-cp312-cp312-arm64 \
            "arrow/python/repaired_wheels/*.whl"
        env:
          CROSSBOW_GITHUB_TOKEN: ${{ secrets.CROSSBOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify uploaded artifacts
        shell: bash
        run: |
          archery crossbow \
            --queue-path $(pwd)/crossbow \
            --queue-remote https://github.com/MugundanMCW/crossbow.git \
            status \
            --task-filter 'wheel-windows-cp312-cp312-arm64' \
            --no-fetch \
            --validate \
            build-29
        env:
          CROSSBOW_GITHUB_TOKEN: ${{ secrets.CROSSBOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      