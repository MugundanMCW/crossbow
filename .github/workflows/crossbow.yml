# NOTE: must set "Crossbow" as name to have the badge links working in the
# github comment reports!
name: Crossbow
on:
  push:
    branches:
      - "*-github-*"

env:
  ARCHERY_DEBUG: 1


jobs:
  build:
    name: "Build wheel for Windows ARM64"
    runs-on: "windows-11-arm"
    timeout-minutes: 90
    env:
      PYTHON_CMD: "py -3.12"
      CMAKE_BUILD_TYPE: release

    steps:
      - name: Disable Crash Dialogs
        run: |
          reg add `
            "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" `
            /v DontShowUI `
            /t REG_DWORD `
            /d 1 `
            /f
      
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: arrow
          repository: MugundanMCW/arrow
          ref: fbd4beb3efda0c5972e759bb7efae77503b64a01
          submodules: recursive


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "ARM64"
      
      - name: Copy vcpkg ARM64 triplet files
        shell: cmd
        run: |
          copy arrow\ci\vcpkg\arm64-windows-*.cmake C:\vcpkg\triplets\community\
      
      - name: Install vcpkg dependencies
        shell: cmd
        run: |
          cd arrow\ci\vcpkg
          C:\vcpkg\vcpkg.exe install ^
            --clean-after-build ^
            --x-install-root=C:\vcpkg\installed ^
            --x-manifest-root=. ^
            --x-feature=flight ^
            --x-feature=gcs ^
            --x-feature=json ^
            --x-feature=orc ^
            --x-feature=parquet ^
            --x-feature=s3

      - name: Build Arrow C++ and PyArrow wheel
        shell: cmd
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "18.0.0"
        run: |
          call "arrow\ci\scripts\python_wheel_windows_build_arm64.bat"
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: arrow/python/repaired_wheels/*.whl

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Checkout Crossbow
        uses: actions/checkout@v4
        with:
          path: crossbow
          ref: build-10
      - name: Setup Crossbow
        shell: bash
        run: |
          python3 -m pip install -e arrow/dev/archery[crossbow]
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Upload artifacts
        shell: bash
        run: |
          archery crossbow \
            --queue-path $(pwd)/crossbow \
            --queue-remote https://github.com/MugundanMCW/crossbow.git \
            upload-artifacts \
            --sha build-10-github-wheel-windows-cp312-cp312-arm64 \
            --tag build-10-github-wheel-windows-cp312-cp312-arm64 \
            "arrow/python/repaired_wheels/*.whl"
        env:
          CROSSBOW_GITHUB_TOKEN: ${{ secrets.CROSSBOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify uploaded artifacts
        shell: bash
        run: |
          archery crossbow \
            --queue-path $(pwd)/crossbow \
            --queue-remote https://github.com/MugundanMCW/crossbow.git \
            status \
            --task-filter 'wheel-windows-cp312-cp312-arm64' \
            --no-fetch \
            --validate \
            build-10
        env:
          CROSSBOW_GITHUB_TOKEN: ${{ secrets.CROSSBOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      